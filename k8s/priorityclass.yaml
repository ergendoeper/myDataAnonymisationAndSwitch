---
# Custom PriorityClass for the inference-router.
# Value 1000000 places it below system-cluster-critical (2000001000) and
# system-node-critical (2000000000) so cluster components always take precedence,
# but above default (0) workloads.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: inference-router-priority
  labels:
    app: inference-router
    environment: production
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Priority class for the inference-router workload (below system-critical, above default)."
