---
# OPA Gatekeeper ConstraintTemplate – disallow privileged containers and
# allowPrivilegeEscalation.
# CIS 5.2.1 – Do not admit privileged containers.
# CIS 5.2.5 – Do not admit containers that allow privilege escalation.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowprivileged
  annotations:
    description: "Disallows privileged: true and allowPrivilegeEscalation: true on containers."
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowPrivileged
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptImages:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowprivileged

        violation[{"msg": msg}] {
          container := input_containers[_]
          not exempt(container)
          container.securityContext.privileged == true
          msg := sprintf("Container '%v' must not be privileged", [container.name])
        }

        violation[{"msg": msg}] {
          container := input_containers[_]
          not exempt(container)
          container.securityContext.allowPrivilegeEscalation == true
          msg := sprintf("Container '%v' must set allowPrivilegeEscalation: false", [container.name])
        }

        exempt(container) {
          img := input.parameters.exemptImages[_]
          startswith(container.image, img)
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
---
# Constraint – apply to the inference-router namespace.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowPrivileged
metadata:
  name: disallow-privileged-inference-router
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - inference-router
  parameters:
    exemptImages: []
