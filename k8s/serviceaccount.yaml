---
# CIS 5.1.5 – Ensure that default service accounts are not bound to active roles.
# Use a dedicated ServiceAccount with least-privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-router
  namespace: inference-router
  labels:
    app: inference-router
    version: "1.0.0"
    environment: production
  annotations:
    # Workload Identity (GKE) – uncomment and set your GSA email when using GKE Workload Identity:
    # iam.gke.io/gcp-service-account: inference-router@<PROJECT_ID>.iam.gserviceaccount.com

    # Workload Identity (EKS IRSA) – uncomment and set your IAM role ARN:
    # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>

    # Azure Workload Identity – uncomment and set your client ID:
    # azure.workload.identity/client-id: "<AZURE_CLIENT_ID>"
# CIS 5.1.6 – Disable automatic token mounting.
automountServiceAccountToken: false
