---
# Ingress – TLS-only; HTTP is redirected to HTTPS.
# Adjust `host` to match your cluster's DNS and ensure cert-manager is installed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-router
  namespace: inference-router
  labels:
    app: inference-router
    version: "1.0.0"
    environment: production
  annotations:
    # TLS enforcement
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Body size limit – reject payloads larger than 1 MB
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # Rate limiting – 60 req/min per client IP (adjust to your SLA)
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # cert-manager will issue and renew the TLS certificate automatically.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inference-router.example.com  # TODO: replace with your actual hostname
      secretName: inference-router-tls
  rules:
    - host: inference-router.example.com  # TODO: replace with your actual hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inference-router
                port:
                  name: http
